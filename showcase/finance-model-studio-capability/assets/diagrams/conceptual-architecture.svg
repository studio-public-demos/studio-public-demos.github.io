<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual Architecture for Finance Model Generation</title>
  <desc id="desc">High-level flow from business brief to validated Excel financial model output.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Conceptual Workflow</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="15" fill="#475569">Public, high-level overview only. Proprietary workflows and implementation details are intentionally excluded.</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#0f172a">
    <rect x="60" y="160" width="150" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="92" y="198" font-weight="700">Business</text>
    <text x="105" y="222" font-weight="700">Brief</text>
    <rect x="250" y="160" width="150" height="90" rx="8" fill="#ecfdf5" stroke="#047857"/>
    <text x="278" y="198" font-weight="700">Assumption</text>
    <text x="286" y="222" font-weight="700">Extraction</text>
    <rect x="440" y="160" width="150" height="90" rx="8" fill="#fef9c3" stroke="#a16207"/>
    <text x="475" y="198" font-weight="700">Financial</text>
    <text x="482" y="222" font-weight="700">Schedules</text>
    <rect x="630" y="160" width="150" height="90" rx="8" fill="#fae8ff" stroke="#a21caf"/>
    <text x="662" y="198" font-weight="700">Statements</text>
    <text x="666" y="222" font-weight="700">&amp; Cash</text>
    <rect x="820" y="160" width="150" height="90" rx="8" fill="#ffedd5" stroke="#c2410c"/>
    <text x="858" y="198" font-weight="700">Dashboard</text>
    <text x="864" y="222" font-weight="700">&amp; Charts</text>
    <rect x="1010" y="160" width="150" height="90" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="1044" y="198" font-weight="700">Validated</text>
    <text x="1047" y="222" font-weight="700">Workbook</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M210 205 H250"/>
    <path d="M400 205 H440"/>
    <path d="M590 205 H630"/>
    <path d="M780 205 H820"/>
    <path d="M970 205 H1010"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <text x="70" y="326">Inputs</text>
    <text x="70" y="350">Business context, goals, assumptions,</text>
    <text x="70" y="372">planning notes, and expected outputs</text>
    <text x="440" y="326">Generated Outputs</text>
    <text x="440" y="350">Assumption sheets, linked calculations,</text>
    <text x="440" y="372">financial statements, and checks</text>
    <text x="820" y="326">User Experience</text>
    <text x="820" y="350">Investor dashboard, charts, use-case</text>
    <text x="820" y="372">summary, and downloadable workbook</text>
  </g>
</svg>
