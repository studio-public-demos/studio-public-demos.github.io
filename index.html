<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Public Demos — Engineering Prototype Portfolio</title>
<meta name="description" content="Central catalogue of NebulaCloud Studio public demonstrations: 18 engineering prototypes across digital twins, geospatial AI, computer vision, aerospace, and enterprise applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F8FAFC;--bg-alt:#FFFFFF;--bg-dark:#0F172A;--bg-dark2:#1E293B;
  --accent:#1D4ED8;--accent-lt:#2563EB;--accent-pale:#EFF6FF;--accent-sky:#0EA5E9;
  --green:#059669;--text:#0F172A;--text-soft:#475569;--text-xs:#94A3B8;
  --border:#E2E8F0;--border-dark:#334155;--card:#FFFFFF;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 16px rgba(15,23,42,.08),0 1px 4px rgba(15,23,42,.04);
  --shadow-lg:0 8px 32px rgba(15,23,42,.10),0 2px 8px rgba(15,23,42,.06);
  --r:12px;--r-lg:18px;
  --f-body:'Inter',system-ui,sans-serif;--f-head:'Cinzel',Georgia,serif;--f-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.container{max-width:1160px;margin:0 auto;padding:0 24px}
.section{padding:72px 0;position:relative;overflow:hidden}
.text-center{text-align:center}
@keyframes orb-drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-70px,55px) scale(1.18)}}
@keyframes ring-float{0%,100%{transform:translateY(0) scale(1);opacity:.35}50%{transform:translateY(-18px) scale(1.04);opacity:.65}}
@keyframes glow-pulse{0%,100%{opacity:.05}50%{opacity:.18}}
@keyframes grid-drift{from{transform:translate(0,0)}to{transform:translate(60px,60px)}}
@keyframes ping{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.6);opacity:0}}
@keyframes aurora{0%{transform:scale(1) translate(0,0);opacity:.6}33%{transform:scale(1.06) translate(-25px,-15px);opacity:.9}66%{transform:scale(.97) translate(20px,10px);opacity:.75}100%{transform:scale(1.1) translate(-12px,8px);opacity:1}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s ease,transform .65s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.section-bg-light,.section-bg-dark{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sbg-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.sbg-orb{position:absolute;border-radius:50%;filter:blur(72px);animation:orb-drift 20s ease-in-out infinite alternate}
.sbg-orb1{width:520px;height:520px;background:radial-gradient(circle,rgba(29,78,216,.07),transparent 70%);top:-160px;right:-80px}
.sbg-orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(14,165,233,.05),transparent 70%);bottom:-100px;left:-60px;animation-duration:25s;animation-delay:-9s}
.sbg-ring{position:absolute;border-radius:50%;border:1px solid rgba(29,78,216,.08);animation:ring-float 14s ease-in-out infinite}
.sbg-r1{width:380px;height:380px;top:-90px;right:-50px;animation-duration:16s}
.sbg-r2{width:200px;height:200px;bottom:30px;left:5%;animation-delay:-6s;animation-duration:11s}
.sbg-grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:60px 60px;animation:grid-drift 32s linear infinite}
.sbg-glow{position:absolute;border-radius:50%;filter:blur(32px);animation:glow-pulse 5s ease-in-out infinite}
.sbg-g1{width:90px;height:90px;background:var(--accent-sky);top:22%;right:12%}
.sbg-g2{width:55px;height:55px;background:var(--accent-lt);bottom:32%;left:9%;animation-delay:-2.5s}
.sbg-aurora{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 15% 25%,rgba(14,165,233,.07),transparent 65%),radial-gradient(ellipse 55% 80% at 80% 65%,rgba(99,102,241,.05),transparent 65%),radial-gradient(ellipse 90% 45% at 50% 90%,rgba(56,189,248,.04),transparent 65%);animation:aurora 18s ease-in-out infinite alternate}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;padding:4px 12px;border-radius:20px;background:var(--accent-pale);border:1px solid rgba(29,78,216,.15)}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent-lt);flex-shrink:0}
h2{font-family:var(--f-head);font-size:clamp(1.9rem,3.8vw,2.8rem);font-weight:700;letter-spacing:.02em;line-height:1.15;color:var(--text);margin-bottom:16px;text-align:center}
h2 .acc{color:var(--accent)}h2 .acc-lt{color:var(--accent-lt)}
.section-sub{font-size:1rem;color:var(--text-soft);max-width:600px;line-height:1.85;margin-bottom:40px;font-weight:400;text-align:center;margin-left:auto;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:8px;font-family:var(--f-body);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .18s;border:none;text-decoration:none;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;box-shadow:0 2px 12px rgba(29,78,216,.32)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(29,78,216,.42)}
.btn-secondary{background:var(--bg-alt);color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-pale)}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:28px;box-shadow:var(--shadow-sm);transition:box-shadow .25s,transform .25s,border-color .25s}
.card:hover{box-shadow:var(--shadow-lg);border-color:rgba(29,78,216,.2);transform:translateY(-2px)}

nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1160px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:24px}
.nav-logo-text{font-family:var(--f-head);font-weight:600;font-size:.85rem;letter-spacing:.1em;color:var(--text)}
.nav-center{flex:1;display:flex;align-items:center;gap:2px;justify-content:center}
.nav-link{font-size:.875rem;font-weight:500;color:var(--text-soft);padding:8px 12px;border-radius:6px;cursor:pointer;border:none;background:none;font-family:var(--f-body);white-space:nowrap;transition:color .15s,background .15s}
.nav-link:hover,.nav-link.active{color:var(--accent);background:var(--accent-pale)}

.hero{position:relative;padding:60px 0 64px;overflow:hidden;background:linear-gradient(160deg,#EFF6FF 0%,#F8FAFC 60%,#EFF6FF 100%);min-height:480px}
.hero-canvas-wrap{position:absolute;inset:0;z-index:0;pointer-events:none}
#hero-canvas{width:100%;height:100%;display:block}
.hero-grid{position:relative;z-index:1;max-width:760px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:24px;padding:6px 14px 6px 8px;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.hero-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-lt);position:relative}
.hero-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--accent-lt);opacity:.4;animation:ping 2s ease-in-out infinite}
.hero h1{font-family:var(--f-head);font-size:clamp(2.2rem,4.5vw,3.2rem);font-weight:700;letter-spacing:.025em;line-height:1.2;color:var(--text);margin-bottom:14px}
.hero h1 .acc{background:linear-gradient(90deg,#1E3A8A,#2563EB);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:1.1rem;color:var(--text-soft);line-height:1.8;max-width:520px;margin-bottom:20px}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--border);margin-top:24px}
.hero-stat-val{font-family:var(--f-head);font-size:1.4rem;font-weight:700;color:var(--text)}
.hero-stat-lbl{font-size:12px;color:var(--text-soft);margin-top:2px;font-weight:600}

.pipeline{display:flex;align-items:center;justify-content:center;gap:0;margin:8px 0 32px;flex-wrap:wrap;position:relative;z-index:1}
.pipe-step{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 12px}
.pipe-num{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(29,78,216,.25)}
.pipe-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft)}
.pipe-arr{color:var(--accent);font-size:24px;padding-bottom:14px;font-weight:700}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px;position:relative;z-index:1}
.cat-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:28px 24px;box-shadow:var(--shadow-sm);transition:all .25s;cursor:pointer;position:relative;overflow:hidden}
.cat-card:hover{box-shadow:var(--shadow-lg);border-color:rgba(29,78,216,.25);transform:translateY(-3px)}
.cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--r) var(--r) 0 0}
.cat-card:nth-child(1)::before{background:linear-gradient(90deg,#2563EB,#60A5FA)}
.cat-card:nth-child(2)::before{background:linear-gradient(90deg,#059669,#34D399)}
.cat-card:nth-child(3)::before{background:linear-gradient(90deg,#7C3AED,#A78BFA)}
.cat-card:nth-child(4)::before{background:linear-gradient(90deg,#0891B2,#22D3EE)}
.cat-card:nth-child(5)::before{background:linear-gradient(90deg,#DB2777,#F472B6)}
.cat-card:nth-child(6)::before{background:linear-gradient(90deg,#D97706,#FBBF24)}
.cat-card:nth-child(7)::before{background:linear-gradient(90deg,#DC2626,#F87171)}
.cat-card:nth-child(8)::before{background:linear-gradient(90deg,#16A34A,#4ADE80)}
.cat-card:nth-child(9)::before{background:linear-gradient(90deg,#4F46E5,#818CF8)}
.cat-icon{font-size:1.8rem;margin-bottom:12px}
.cat-card h3{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.cat-subtitle{font-size:.82rem;color:var(--text-soft);margin-bottom:12px;line-height:1.5}
.cat-count{display:inline-block;padding:3px 12px;border-radius:12px;font-size:.75rem;font-weight:700;background:var(--accent-pale);color:var(--accent)}
.cat-subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.cat-subtag{font-size:.7rem;padding:3px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text-soft);font-weight:500}

.stats-row{display:flex;justify-content:center;gap:48px;flex-wrap:wrap;margin-top:8px;padding-top:32px;border-top:1px solid var(--border);position:relative;z-index:1}
.stat-item{text-align:center}
.stat-val{font-family:var(--f-head);font-size:1.75rem;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;font-weight:600}

.search-bar{position:relative;margin-bottom:20px;max-width:600px;margin-inline:auto;z-index:1}
.search-bar input{width:100%;padding:14px 20px 14px 48px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--bg-alt);color:var(--text);font-size:.95rem;outline:none;box-shadow:var(--shadow-sm);font-family:var(--f-body);transition:border-color .2s}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.search-bar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-xs);width:20px;height:20px}
.filter-bar,.facet-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;justify-content:center;align-items:center;position:relative;z-index:1}
.filter-label{font-size:.7rem;color:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-right:4px}
.filter-chip{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg-alt);color:var(--text-soft);cursor:pointer;font-size:.82rem;font-weight:500;transition:all .15s;font-family:var(--f-body);white-space:nowrap}
.filter-chip:hover{background:var(--accent-pale);border-color:var(--accent);color:var(--accent)}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.filter-chip .count{font-size:.7rem;opacity:.7;margin-left:4px}

.demos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;position:relative;z-index:1}
.demo-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--shadow-sm);transition:all .25s;display:flex;flex-direction:column;cursor:pointer}
.demo-card:hover{box-shadow:var(--shadow-lg);border-color:rgba(29,78,216,.2);transform:translateY(-2px)}
.demo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.demo-name{font-size:1rem;font-weight:700;color:var(--text);line-height:1.3}
.badge{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:2px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.badge-beta{background:#EFF6FF;color:#1D4ED8}.badge-prototype{background:#FEF3C7;color:#92400E}.badge-concept{background:#F5F3FF;color:#6D28D9}
.demo-meta-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.meta-cat{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-pale);color:var(--accent)}
.meta-ind{font-family:var(--f-mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:#F5F3FF;color:#6D28D9}
.demo-desc{font-size:.875rem;color:var(--text-soft);line-height:1.6;margin-bottom:12px;flex:1}
.demo-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.demo-tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--text-soft);font-weight:500}
.demo-footer{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;font-family:var(--f-mono);border-top:1px solid var(--border);padding-top:12px;flex-wrap:wrap;gap:8px}
.demo-footer a{color:var(--accent);font-weight:600;font-size:.75rem}
.demo-live-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;font-size:.72rem;font-weight:600;background:var(--accent-pale);color:var(--accent);text-decoration:none;transition:all .15s}
.demo-live-btn:hover{background:var(--accent);color:#fff}

.no-results{text-align:center;padding:80px 24px;grid-column:1/-1;position:relative;z-index:1}
.no-results h3{font-size:1.3rem;font-weight:700;color:var(--text);margin-bottom:8px}
.no-results p{color:var(--text-soft)}

footer{background:var(--bg-dark);color:#94A3B8;padding:40px 0;text-align:center;border-top:1px solid var(--border-dark);position:relative;z-index:1}
footer p{font-size:.875rem}footer a{color:var(--accent-sky);font-weight:600}

/* Detail page */
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;color:var(--accent);cursor:pointer;margin-bottom:24px;padding:8px 16px;border-radius:8px;background:var(--accent-pale);border:none;font-family:var(--f-body);transition:background .15s}
.detail-back:hover{background:var(--bg)}
.detail-header{margin-bottom:28px}
.detail-header h2{text-align:left;font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:8px}
.detail-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.detail-desc{font-size:1.05rem;color:var(--text-soft);line-height:1.8;max-width:760px;margin-bottom:24px}
.detail-links{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.detail-section{margin-bottom:32px}
.detail-section h4{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-xs);margin-bottom:10px}
.detail-tags{display:flex;flex-wrap:wrap;gap:6px}
.detail-stack{display:flex;flex-wrap:wrap;gap:4px}
.stack-chip{font-family:var(--f-mono);font-size:11px;padding:4px 10px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--text-soft)}

@media(max-width:1024px){.cat-grid{grid-template-columns:repeat(2,1fr)}.demos-grid{grid-template-columns:1fr}}
@media(max-width:768px){
  .nav-center{display:none}
  .hero h1{font-size:1.8rem}.hero{padding:40px 0 48px;min-height:auto}
  .cat-grid{grid-template-columns:1fr}.demos-grid{grid-template-columns:1fr}
  .section{padding:48px 0}.stats-row{gap:24px}.stat-val{font-size:1.4rem}
  .pipeline{gap:0}.pipe-step{padding:0 6px}.pipe-num{width:30px;height:30px;font-size:10px}.pipe-arr{font-size:18px}
  .filter-bar{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo-text" style="text-decoration:none">STUDIO DEMOS</a>
    <div class="nav-center">
      <button class="nav-link active" data-view="categories">Categories</button>
      <button class="nav-link" data-view="technology">By Technology</button>
      <button class="nav-link" data-view="industry">By Industry</button>
      <button class="nav-link" data-view="all">Browse All</button>
    </div>
    <div class="nav-end"><a href="https://nebulacloud.studio" class="btn btn-primary" style="padding:8px 18px;font-size:.85rem">nebulacloud.studio</a></div>
  </div>
</nav>

<div id="app"></div>

<footer><p><a href="https://nebulacloud.studio">Built with NebulaCloud Studio</a> · Engineering Execution Platform</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){const canvas=document.getElementById('hero-canvas');if(!canvas)return;const hero=canvas.closest('.hero');canvas.style.opacity='0';function initHero(){const W=hero.clientWidth||window.innerWidth;const H=hero.clientHeight||Math.round(W*0.65);if(!W||!H)return;canvas.width=W;canvas.height=H;let renderer;try{renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:!(/Mobi|Android/i.test(navigator.userAgent))})}catch(e){canvas.style.display='none';return}renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.setSize(W,H);renderer.setClearColor(0,0);const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(55,W/H,0.1,100);camera.position.set(0,0,5.5);const globeGroup=new THREE.Group();globeGroup.position.x=2.8;scene.add(globeGroup);const geoOuter=new THREE.IcosahedronGeometry(2,3);const wireOuter=new THREE.WireframeGeometry(geoOuter);const meshOuter=new THREE.LineSegments(wireOuter,new THREE.LineBasicMaterial({color:0x0369A1,transparent:true,opacity:0.13}));globeGroup.add(meshOuter);const geoInner=new THREE.IcosahedronGeometry(1.1,2);const meshInner=new THREE.LineSegments(new THREE.WireframeGeometry(geoInner),new THREE.LineBasicMaterial({color:0x0EA5E9,transparent:true,opacity:0.22}));globeGroup.add(meshInner);const nodeGeo=new THREE.SphereGeometry(0.055,10,10);const nodes=[];const nodeColors=[0x0369A1,0x0EA5E9,0x38BDF8,0x0369A1,0x0EA5E9,0x7DD3FC,0x0369A1,0x0EA5E9];for(let i=0;i<8;i++){const mat=new THREE.MeshBasicMaterial({color:nodeColors[i],transparent:true,opacity:0.85});const node=new THREE.Mesh(nodeGeo,mat);const phi=Math.acos(-1+(2*i)/8);const theta=Math.sqrt(8*Math.PI)*phi;const r=2.6;node.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));node.userData={r,phi,baseTheta:theta,speed:0.0004+Math.random()*0.0003};globeGroup.add(node);nodes.push(node)}const lineMat=new THREE.LineBasicMaterial({color:0x0EA5E9,transparent:true,opacity:0.15});for(let i=0;i<nodes.length;i++){const j=(i+2)%nodes.length;globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([nodes[i].position.clone(),nodes[j].position.clone()]),lineMat))}const pPos=new Float32Array(840);for(let i=0;i<280;i++){pPos[i*3]=(Math.random()-0.5)*9;pPos[i*3+1]=(Math.random()-0.5)*9;pPos[i*3+2]=(Math.random()-0.5)*5}const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x0369A1,size:0.025,transparent:true,opacity:0.45})));let mx=0,my=0,tmx=0,tmy=0;document.addEventListener('mousemove',e=>{tmx=(e.clientX/window.innerWidth-0.5)*0.6;tmy=-(e.clientY/window.innerHeight-0.5)*0.4});const clock=new THREE.Clock();(function a(){requestAnimationFrame(a);const t=clock.getElapsedTime();meshOuter.rotation.x=t*0.08;meshOuter.rotation.y=t*0.12;meshInner.rotation.x=-t*0.12;meshInner.rotation.y=t*0.18;nodes.forEach((n,i)=>{const theta=n.userData.baseTheta+t*n.userData.speed*60;n.position.set(n.userData.r*Math.sin(n.userData.phi)*Math.cos(theta),n.userData.r*Math.cos(n.userData.phi)+Math.sin(t*0.4+i)*0.08,n.userData.r*Math.sin(n.userData.phi)*Math.sin(theta))});mx+=(tmx-mx)*0.05;my+=(tmy-my)*0.05;globeGroup.position.x=2.8+mx;globeGroup.position.y=my;camera.lookAt(scene.position);renderer.render(scene,camera)})();canvas.style.transition='opacity .4s ease';canvas.style.opacity='.85';window.addEventListener('resize',()=>{const nW=hero.clientWidth,nH=hero.clientHeight;if(!nW||!nH)return;camera.aspect=nW/nH;camera.updateProjectionMatrix();renderer.setSize(nW,nH)})}if(typeof THREE!=='undefined')requestAnimationFrame(initHero);else canvas.style.display='none'})();
</script>

<script>
// Global helpers
function bgDecor(type){return `<div class="sec-bg"><canvas class="sbg-canvas" data-bg="${type}"></canvas><div class="sbg-orb sbg-orb1"></div><div class="sbg-orb sbg-orb2"></div><div class="sbg-ring sbg-r1"></div><div class="sbg-ring sbg-r2"></div></div>`}
function bgDark(type){return `<div class="sec-bg"><canvas class="sbg-canvas" data-bg="${type}"></canvas><div class="sbg-grid"></div><div class="sbg-orb sbg-orb1"></div><div class="sbg-orb sbg-orb2"></div><div class="sbg-ring sbg-r1"></div><div class="sbg-glow sbg-g1"></div><div class="sbg-glow sbg-g2"></div></div>`}
const CATALOGUE_URL='catalogue.json';
const IND_LOOKUP={'defence-aerospace':'Defence & Aerospace','geospatial-smart-cities':'Geospatial & Smart Cities','manufacturing':'Manufacturing','climate-environment':'Climate & Environment','transportation':'Transportation','energy-utilities':'Energy & Utilities','construction-infrastructure':'Construction & Infrastructure','government':'Government','enterprise':'Enterprise','marine-circular-economy':'Marine & Circular Economy'};
const CATEGORY_META={
  'agentic-ai-autonomous-workflows':{name:'Agentic AI & Autonomous Workflows',icon:'🤖',subtitle:'Studio core autonomous execution — software engineering, research agents, document intelligence',subs:['Autonomous SE','Research Agents','Document AI','Business Automation']},
  'physical-ai-engineering':{name:'Physical AI & Engineering',icon:'⚙️',subtitle:'Simulation, CFD, aerodynamics, computational design & real-world systems',subs:['CFD','Aerospace','Mechanical','Simulation','Test Systems']},
  'digital-twins-spatial-intelligence':{name:'Digital Twins & Spatial Intelligence',icon:'🏙️',subtitle:'3D environments, operational twins, BIM, urban models & spatial simulation',subs:['Urban Twins','Industrial Twins','BIM','3D Viz','Cultural Heritage']},
  'geoai-earth-intelligence':{name:'GeoAI & Earth Intelligence',icon:'🌍',subtitle:'Satellite imagery, urban analytics, change detection, geospatial dashboards',subs:['Satellite','Urban Analytics','Change Detection','GIS','Remote Sensing']},
  'computer-vision-visual-intelligence':{name:'Computer Vision & Visual Intelligence',icon:'👁️',subtitle:'LiDAR, surveying, point clouds, inspection & visual data processing',subs:['LiDAR','Surveying','Point Cloud','3D Terrain','Remote Sensing']},
  'industrial-ai-predictive-operations':{name:'Industrial AI & Predictive Operations',icon:'🏭',subtitle:'Factories, predictive maintenance, IoT, process intelligence & asset management',subs:['Predictive Maint','IoT','Asset Mgmt','Quality','Process Intel']},
  'defence-aerospace':{name:'Defence & Aerospace',icon:'🛡️',subtitle:'Aerospace engineering, seaplane infrastructure, VLM simulation & mission systems',subs:['Aerospace','Seaplane','VLM','Infrastructure','Mission Support']},
  'climate-environment-sustainability':{name:'Climate & Sustainability',icon:'🌿',subtitle:'Ocean plastic, coastal intelligence, environmental monitoring & circular economy',subs:['Ocean Intel','Plastic Tracking','Coastal','Circular Economy','Monitoring']},
  'enterprise-applications-decision-intelligence':{name:'Enterprise & Decision Intelligence',icon:'🏢',subtitle:'CRM, sales platforms, commercial websites & business decision systems',subs:['CRM','Sales','Landing Pages','Dashboards','Backend']}
};
const TECH_OPTIONS=['Digital Twins','3D Visualization','Geospatial','Simulation','Computer Vision','Aerospace','Enterprise','Environmental'];
const INDUSTRY_OPTIONS=['Defence & Aerospace','Geospatial & Smart Cities','Manufacturing','Climate & Environment','Transportation','Energy & Utilities','Construction & Infrastructure','Government','Enterprise','Marine & Circular Economy'];

let demos=[],currentView='categories',activeFilters={category:null,technology:null,industry:null},searchQuery='';

async function init(){
  try{const r=await fetch(CATALOGUE_URL);demos=(await r.json()).demos;route()}catch(e){document.getElementById('app').innerHTML=`<div class="no-results"><h3>Could not load catalogue</h3><p>${e.message}</p></div>`;}
}
function route(){
  const p=new URLSearchParams(window.location.search);
  const demo=p.get('demo');
  if(demo){renderDetail(demo);return}
  const cat=p.get('category');const tech=p.get('technology');const ind=p.get('industry');
  if(cat){currentView='all';activeFilters={category:cat,technology:null,industry:null};}
  else if(tech){currentView='all';activeFilters={category:null,technology:tech,industry:null};}
  else if(ind){currentView='all';activeFilters={category:null,technology:null,industry:ind};}
  setupNav();renderView();
}
function setupNav(){
  document.querySelectorAll('.nav-link').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;activeFilters={category:null,technology:null,industry:null};searchQuery='';window.history.pushState({},'','/');renderView();setTimeout(()=>window.scrollTo({top:document.getElementById('main-content')?document.getElementById('main-content').offsetTop-80:300,behavior:'smooth'}),100);});});
}
function renderView(){
  const app=document.getElementById('app');
  if(currentView==='categories')app.innerHTML=buildHome();
  else if(currentView==='technology')app.innerHTML=buildFacet('technology',TECH_OPTIONS,'tech','Technology','ico');
  else if(currentView==='industry')app.innerHTML=buildFacet('industry',INDUSTRY_OPTIONS,'ind','Industry','octa');
  else app.innerHTML=buildAll();
  bindAll();
  updateGrid();
  observeReveal();
  history.replaceState({},'',currentView==='categories'?'/':'/#'+currentView);
}

function renderFeaturedNepal(){
  const demo=demos.find(d=>d.repo_name==='nepal-flash-flood-digital-twin');
  if(!demo)return '';
  return `<section class="section" style="padding-top:40px"><div class="container"><div class="text-center"><span class="eyebrow">Featured Showcase</span><h2>Nepal Flash Flood <span class="acc">Digital Twin</span></h2><p class="section-sub">Replay the August 26 reference reconstruction, run 2-5 Mm3 barrier-lake what-if scenarios, and inspect modeled infrastructure exposure.</p></div><div class="demos-grid">${renderCard(demo)}</div></div></section>`;
}

function buildHome(){
  return `<section class="hero"><div class="hero-canvas-wrap"><canvas id="hero-canvas"></canvas></div><div class="sbg-orb sbg-orb1"></div><div class="sbg-orb sbg-orb2"></div><div class="sbg-ring sbg-r1"></div><div class="sbg-ring sbg-r2"></div><div class="container"><div class="hero-grid"><div class="hero-badge"><div class="hero-dot"></div>${demos.length} Live Demos · ${Object.keys(CATEGORY_META).length} Categories</div><h1>Engineering prototypes.<br><span class="acc">Executed and verified.</span></h1><p class="hero-sub">A central catalogue of Studio's public demonstrations — digital twins, geospatial intelligence, computer vision, aerospace simulation, and enterprise applications. Most demos link to live deployments; select case studies are available upon request.</p><div class="hero-stats"><div><div class="hero-stat-val">${demos.length}</div><div class="hero-stat-lbl">Demos</div></div><div><div class="hero-stat-val">${Object.keys(CATEGORY_META).length}</div><div class="hero-stat-lbl">Categories</div></div><div><div class="hero-stat-val">${demos.filter(d => d.pagesUrl && d.accessMode !== 'request').length}</div><div class="hero-stat-lbl">Live Deployments</div></div><div><div class="hero-stat-val">${new Set(demos.flatMap(d=>d.industry)).size}</div><div class="hero-stat-lbl">Industries</div></div></div></div></div></section><div class="section" style="padding:32px 0"><div class="section-bg-light"><div class="sbg-aurora"></div></div><div class="container"><div class="text-center"><span class="eyebrow">How to Explore</span></div><div class="pipeline"><div class="pipe-step"><div class="pipe-num">01</div><div class="pipe-lbl">Category</div></div><div class="pipe-arr">→</div><div class="pipe-step"><div class="pipe-num">02</div><div class="pipe-lbl">Filter</div></div><div class="pipe-arr">→</div><div class="pipe-step"><div class="pipe-num">03</div><div class="pipe-lbl">Explore</div></div><div class="pipe-arr">→</div><div class="pipe-step"><div class="pipe-num">04</div><div class="pipe-lbl">Launch</div></div></div></div></div>${renderFeaturedNepal()}<section id="sec-categories" class="section"><div class="section-bg-light"><canvas class="sbg-canvas" data-bg="ico"></canvas><div class="sbg-orb sbg-orb1"></div><div class="sbg-orb sbg-orb2"></div><div class="sbg-ring sbg-r1"></div><div class="sbg-ring sbg-r2"></div></div><div class="container"><div class="text-center"><span class="eyebrow">${Object.keys(CATEGORY_META).length} Technology Categories</span><h2>Explore by <span class="acc">Domain</span></h2><p class="section-sub">Every demo is verified, classified by primary technology domain, industry sector, and capability tags.</p></div><div class="cat-grid">${Object.entries(CATEGORY_META).map(([k,m])=>{const c=demos.filter(d=>d.primaryCategory===k).length;return c===0?'':`<div class="cat-card reveal" data-cat="${k}"><div class="cat-icon">${m.icon}</div><h3>${m.name}</h3><div class="cat-subtitle">${m.subtitle}</div><span class="cat-count">${c} demos</span><div class="cat-subs">${m.subs.map(s=>`<span class="cat-subtag">${s}</span>`).join('')}</div></div>`}).join('')}</div><div class="stats-row reveal"><div class="stat-item"><div class="stat-val">${demos.length}</div><div class="stat-lbl">Total Demos</div></div><div class="stat-item"><div class="stat-val">${demos.filter(d=>d.maturity==='beta').length}</div><div class="stat-lbl">Beta</div></div><div class="stat-item"><div class="stat-val">${demos.filter(d=>d.maturity==='prototype').length}</div><div class="stat-lbl">Prototypes</div></div><div class="stat-item"><div class="stat-val">${demos.filter(d => d.pagesUrl && d.accessMode !== 'request').length}</div><div class="stat-lbl">Live</div></div></div></div></section><div id="main-content"></div>`;
}

function buildFacet(field,options,prefix,label,sbgType){
  return `<section id="sec-${prefix}" class="section">${bgDecor(sbgType)}<div class="container"><div class="text-center"><span class="eyebrow">Discovery Path</span><h2>Browse by <span class="acc">${label}</span></h2><p class="section-sub">Filter the demo portfolio by ${label.toLowerCase()} to find relevant capabilities.</p></div><div class="search-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="search-input" placeholder="Search demos..." autocomplete="off"></div><div class="facet-filters">${options.map(o=>{const c=countByFacet(field,o);return c===0?'':`<button class="filter-chip ${prefix}-chip" data-${prefix}="${o}">${o}<span class="count">${c}</span></button>`}).join('')}</div><div class="demos-grid" id="demos-grid"></div></div></section>`;
}
function countByFacet(f,val){
  if(f==='technology')return demos.filter(d=>d.tags.some(t=>t.toLowerCase().includes(val.toLowerCase()))).length;
  if(f==='industry'){const k=Object.entries(IND_LOOKUP).find(([,v])=>v===val)?.[0];return demos.filter(d=>d.industry.includes(k)).length;}return 0;
}

function buildAll(){
  return `<section id="sec-all" class="section"><div class="section-bg-light"><canvas class="sbg-canvas" data-bg="torus"></canvas><div class="sbg-orb sbg-orb1"></div><div class="sbg-orb sbg-orb2"></div><div class="sbg-ring sbg-r1"></div><div class="sbg-ring sbg-r2"></div></div><div class="container"><div class="text-center"><span class="eyebrow">Complete Portfolio</span><h2>Browse All <span class="acc">${demos.length} Demos</span></h2><p class="section-sub">Search across all demos, or filter by category and capability tags.</p></div><div class="search-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="search-input" placeholder="Search all demos by name, tag, or description..." autocomplete="off"></div><div class="filter-bar"><span class="filter-label">Category:</span>${Object.entries(CATEGORY_META).map(([k,m])=>{const c=demos.filter(d=>d.primaryCategory===k).length;return c===0?'':`<button class="filter-chip cat-chip" data-category="${k}">${m.name.split('&')[0].trim()}<span class="count">${c}</span></button>`}).join('')}</div><div class="demos-grid" id="demos-grid"></div></div></section>`;
}

function bindAll(){
  document.querySelectorAll('.cat-card').forEach(card=>{card.addEventListener('click',()=>{const cat=card.dataset.cat;window.location.href='/?category='+cat;});});
  document.querySelectorAll('.cat-chip').forEach(ch=>{ch.addEventListener('click',()=>{if(ch.classList.contains('active')){ch.classList.remove('active');activeFilters.category=null}else{document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));ch.classList.add('active');activeFilters.category=ch.dataset.category}updateGrid()})});
  document.querySelectorAll('.tech-chip').forEach(ch=>{ch.addEventListener('click',()=>{if(ch.classList.contains('active')){ch.classList.remove('active');activeFilters.technology=null}else{document.querySelectorAll('.tech-chip').forEach(c=>c.classList.remove('active'));ch.classList.add('active');activeFilters.technology=ch.dataset.tech}updateGrid()})});
  document.querySelectorAll('.ind-chip').forEach(ch=>{ch.addEventListener('click',()=>{if(ch.classList.contains('active')){ch.classList.remove('active');activeFilters.industry=null}else{document.querySelectorAll('.ind-chip').forEach(c=>c.classList.remove('active'));ch.classList.add('active');const k=Object.entries(IND_LOOKUP).find(([,v])=>v===ch.dataset.ind)?.[0];activeFilters.industry=k||null}updateGrid()})});
  const si=document.getElementById('search-input');if(si)si.addEventListener('input',()=>{searchQuery=si.value;updateGrid()});
  document.querySelectorAll('.demo-card').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('a'))return;const rn=card.dataset.repo;if(rn)window.location.href='/?demo='+rn;});});
}
function observeReveal(){document.querySelectorAll('.reveal').forEach(el=>{const io2=new IntersectionObserver(([e])=>{if(e.isIntersecting){e.target.classList.add('visible');io2.unobserve(e.target)}},{threshold:0.1});io2.observe(el);});}

function updateGrid(){
  const grid=document.getElementById('demos-grid');if(!grid)return;
  let f=[...demos];
  if(searchQuery){const q=searchQuery.toLowerCase();f=f.filter(d=>d.name.toLowerCase().includes(q)||d.summary.toLowerCase().includes(q)||d.tags.some(t=>t.toLowerCase().includes(q))||d.description.toLowerCase().includes(q));}
  if(activeFilters.category)f=f.filter(d=>d.primaryCategory===activeFilters.category);
  if(activeFilters.technology)f=f.filter(d=>d.tags.some(t=>t.toLowerCase().includes(activeFilters.technology.toLowerCase())));
  if(activeFilters.industry)f=f.filter(d=>d.industry.includes(activeFilters.industry));
  if(!f.length){grid.innerHTML=`<div class="no-results"><h3>No matching demos</h3><p>Try adjusting filters or search terms.</p></div>`;return}
  grid.innerHTML=f.map(d=>renderCard(d)).join('');
  observeReveal();
  document.querySelectorAll('.demo-card').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('a'))return;const rn=card.dataset.repo;if(rn)window.location.href='/?demo='+rn;});});
}

function renderCard(d){
  const cm=CATEGORY_META[d.primaryCategory]||{name:d.primaryCategory};
  const ics=d.industry.map(i=>IND_LOOKUP[i]||i).join(' · ');
  return `<div class="demo-card reveal" data-repo="${d.repo_name}">
    <div class="demo-head"><div class="demo-name">${d.name}</div><span class="badge badge-${d.maturity}">${d.maturity}</span></div>
    <div class="demo-meta-row"><span class="meta-cat">${cm.name}</span><span class="meta-ind">${ics}</span></div>
    <div class="demo-desc">${d.summary}</div>
    <div class="demo-tags">${d.tags.slice(0,4).map(t=>`<span class="demo-tag">${t}</span>`).join('')}${d.tags.length>4?`<span class="demo-tag">+${d.tags.length-4}</span>`:''}</div>
    <div class="demo-footer">
      <span>${d.technologyStack.slice(0,3).join(' · ')}</span>
      <span>${d.pagesUrl?`<a href="${d.pagesUrl}" target="_blank" class="demo-live-btn">Live →</a>`:`<span style="color:var(--text-xs)">Repo only</span>`}</span>
    </div>
  </div>`;
}

function renderDetail(repoName){
  const d=demos.find(x=>x.repo_name===repoName);
  if(!d){document.getElementById('app').innerHTML=`<div class="section"><div class="container"><div class="no-results"><h3>Demo not found</h3><p>${repoName}</p><button class="btn btn-secondary" onclick="window.location='/'">Back to Catalogue</button></div></div></div>`;return;}
  const cm=CATEGORY_META[d.primaryCategory]||{name:d.primaryCategory};
  document.getElementById('app').innerHTML=`<section class="section"><div class="section-bg-light"><canvas class="sbg-canvas" data-bg="torus"></canvas><div class="sbg-orb sbg-orb1"></div><div class="sbg-orb sbg-orb2"></div></div><div class="container">
    <button class="detail-back" onclick="window.location='/'">← Back to Catalogue</button>
    <div class="detail-header"><h2>${d.name}</h2>
      <div class="detail-meta">
        <span class="meta-cat" style="font-size:11px;padding:4px 12px">${cm.name}</span>
        <span class="badge badge-${d.maturity}" style="font-size:11px;padding:3px 12px">${d.maturity}</span>
        ${d.industry.map(i=>`<span class="meta-ind" style="font-size:11px;padding:4px 12px">${IND_LOOKUP[i]||i}</span>`).join('')}
      </div>
    </div>
    <div class="detail-desc">${d.description}</div>
    <div class="detail-links">
      ${d.pagesUrl?`<a href="${d.pagesUrl}" target="_blank" class="btn btn-primary">Launch Live Demo</a>`:''}
      <a href="${d.repoUrl}" target="_blank" class="btn btn-secondary">View Repository</a>
    </div>
    <div class="detail-section"><h4>Capability Tags</h4><div class="detail-tags">${d.tags.map(t=>`<span class="demo-tag" style="font-size:12px;padding:4px 12px">${t}</span>`).join('')}</div></div>
    <div class="detail-section"><h4>Technology Stack</h4><div class="detail-stack">${d.technologyStack.map(t=>`<span class="stack-chip">${t}</span>`).join('')}</div></div>
    ${d.dataProvenance?`<div class="detail-section"><h4>Data Provenance</h4><p style="color:var(--text-soft);font-size:.9rem">${d.dataProvenance}</p></div>`:''}
  </div></section>`;
}

init();
</script>
</body>
</html>
